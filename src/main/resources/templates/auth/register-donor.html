<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: html-head('Donor Registration - AnnaSetu')}">
    <title>Donor Registration - AnnaSetu</title>
</head>
<body>

    <!-- Header Navigation -->
    <header th:replace="~{fragments/layout :: navbar}"></header>

    <!-- Global Flash Messages -->
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <main class="main-content">
        <div class="container">
            <div class="auth-wrapper">
                <div class="auth-card">
                    <div class="auth-header">
                        <span class="badge" style="background-color: var(--color-primary-light); color: var(--color-primary); margin-bottom: 0.75rem;">
                            Donor Onboarding
                        </span>
                        <h1 class="auth-title">Create Donor Account</h1>
                        <p class="auth-subtitle">Join AnnaSetu to sponsor meals on birthdays, anniversaries, and special days</p>
                    </div>

                    <!-- Donor Registration Form -->
                    <form th:action="@{/register/donor}" th:object="${donorForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="form-group">
                            <label for="fullName" class="form-label">Full Name *</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Rahul Sharma" />
                            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="field-error"></span>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="e.g. rahul.sharma@example.com" />
                            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="password" class="form-label">Password *</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       placeholder="At least 6 characters" />
                                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword" class="form-label">Confirm Password *</label>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                       placeholder="Repeat password" />
                                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="field-error"></span>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="phone" class="form-label">Contact Phone</label>
                                <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                       placeholder="e.g. 9811122233" />
                                <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="field-error"></span>
                            </div>

                            <div class="form-group">
                                <label for="city" class="form-label">City *</label>
                                <input type="text" id="city" th:field="*{city}" class="form-control"
                                       th:classappend="${#fields.hasErrors('city')} ? 'is-invalid' : ''"
                                       placeholder="e.g. Pune" />
                                <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="field-error"></span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem; font-size: 1rem; margin-top: 0.75rem;">
                            Complete Registration
                        </button>
                    </form>

                    <div class="auth-footer">
                        <p style="margin-bottom: 0.5rem;">Already registered? <a th:href="@{/login}">Sign In</a></p>
                        <p>Are you a shelter or orphanage? <a th:href="@{/register/organization}">Onboard as an NGO</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
