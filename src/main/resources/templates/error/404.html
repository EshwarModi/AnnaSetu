<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: html-head('404 - Page Not Found')}">
    <title>404 - Page Not Found</title>
</head>
<body>

    <!-- Header Navigation -->
    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="main-content">
        <div class="error-page">
            <div class="error-badge">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc" th:text="${errorMessage}">
                The requested page or meal slot resource could not be found. It may have been moved or the URL is incorrect.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a th:href="@{/}" class="btn btn-primary">Return to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
