# ===================================================================
# AnnaSetu Application Properties Template (Example)
# Copy this file to application-local.properties or set system env vars.
# ===================================================================
spring.application.name=annasetu
server.port=8080

# Datasource Configuration (Replace with your MySQL instance details)
spring.datasource.url=jdbc:mysql://localhost:3306/annasetu?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_secure_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Database Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.jpa.defer-datasource-initialization=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Business Rules
annasetu.booking.cancellation-cutoff-hours=12

# Email Notifications (Spring Mail)
annasetu.mail.enabled=false
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your_email@example.com
spring.mail.password=your_email_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Error Handling & Security Hygiene
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

