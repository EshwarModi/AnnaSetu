# ===================================================================
# AnnaSetu Application Configuration (Development Profile)
# ===================================================================
spring.application.name=annasetu
server.port=8080

# -------------------------------------------------------------------
# Datasource Configuration (MySQL 8)
# Uses environment variables DB_USERNAME and DB_PASSWORD if present,
# defaulting to local dev credentials (root/root).
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/annasetu?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# ddl-auto=validate ensures DB schema matches Java entity mappings
# without auto-modifying or dropping production data.
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Database Initialization (spring.sql.init)
# Executes schema.sql and seed.sql before Hibernate validation.
# -------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.jpa.defer-datasource-initialization=false

# -------------------------------------------------------------------
# Thymeleaf Configuration
# Cache is disabled for live template reload during development.
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.annasetu=INFO
logging.level.org.springframework.security=INFO

annasetu.booking.cancellation-cutoff-hours=12

# -------------------------------------------------------------------
# Email Notification Configuration (Spring Mail)
# Disabled by default; logs simulated notifications without SMTP failure.
# -------------------------------------------------------------------
annasetu.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# -------------------------------------------------------------------
# Error Handling & Security Hygiene
# Prevents stack trace leakages and raw server details in error responses
# -------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

